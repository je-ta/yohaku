# Cloudflare Workers の静的アセット配信＋計測。
# wrangler 4.15x 以降、Pages は Workers に統合されたのでこちらの形式を使う。
name = "yohaku"
main = "./worker/index.ts"
compatibility_date = "2026-10-24"

[assets]
directory = "./dist"
binding = "ASSETS"
# 存在しないパスは 404.html を返す
not_found_handling = "404-page"
# ここに載せたパスだけ Worker を通す。それ以外（HTML/CSS/画像）は
# エッジから直接返るので、ページ表示のレイテンシは変わらない。
run_worker_first = ["/__a.gif", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "yohaku-analytics"
database_id = "0a64d25e-0ddc-4174-978d-b2db5202b24c"

[observability]
enabled = true
